commands:
  help: |-
    <#4e46c2><strikethrough>                          </strikethrough></#4e46c2> <#ad60e0>命令</#ad60e0> <#4e46c2><strikethrough>                          </strikethrough></#4e46c2>
    <gray><italic>    将鼠标悬停在命令上查看详情，点击以执行。</italic></gray>

    <click:suggest_command:'/npcavatar upload '><hover:show_text:'<white>/npcavatar upload <gold><id></gold> <#ad60e0>[path]</#ad60e0></white><newline><newline><gray>将 Figura 头像文件夹中的头像上传到服务器。</gray><newline><newline><gray><gold>id</gold>:</gray> <gray>头像标识符（命名空间可选）。</gray><newline><gray><#ad60e0>[path]</#ad60e0>:</gray> <gray>可选的 Figura 相对路径，默认为 id。</gray><newline><newline><dark_gray>权限:</dark_gray> <gray>npcavatar.upload</gray>'><#ad60e0>  /npcavatar upload</#ad60e0> <gray>-</gray> <white>上传头像文件夹到服务器。</white></hover></click>
    <click:suggest_command:'/npcavatar apply '><hover:show_text:'<white>/npcavatar apply <gold><avatarId></gold> <#ad60e0>[target]</#ad60e0></white><newline><newline><gray>将已上传的头像应用到你所注视的实体（最多 10 格）或指定的实体。</gray><newline><newline><dark_gray>权限:</dark_gray> <gray>npcavatar.apply</gray>'><#ad60e0>  /npcavatar apply</#ad60e0> <gray>-</gray> <white>将头像应用到实体。</white></hover></click>
    <click:suggest_command:'/npcavatar copy '><hover:show_text:'<white>/npcavatar copy <gold><source></gold> <#ad60e0>[targets]</#ad60e0></white><newline><newline><gray>将一个实体当前的头像复制到你所注视的实体（最多 10 格）或指定的实体。</gray><newline><newline><dark_gray>权限:</dark_gray> <gray>npcavatar.apply</gray>'><#ad60e0>  /npcavatar copy</#ad60e0> <gray>-</gray> <white>将头像从一个实体复制到另一个实体。</white></hover></click>
    <click:suggest_command:'/npcavatar copyfromplayer '><hover:show_text:'<white>/npcavatar copyfromplayer <gold><player></gold> <#ad60e0>[targets]</#ad60e0></white><newline><newline><gray>将玩家当前的头像复制到你所注视的实体（最多 10 格）或指定的实体。</gray><newline><newline><dark_gray>权限:</dark_gray> <gray>npcavatar.apply</gray>'><#ad60e0>  /npcavatar copyfromplayer</#ad60e0> <gray>-</gray> <white>应用玩家的头像。</white></hover></click>
    <click:suggest_command:'/npcavatar clear'><hover:show_text:'<white>/npcavatar clear <#ad60e0>[target]</#ad60e0></white><newline><newline><gray>从你所注视的实体（最多 10 格）或指定的实体中清除已应用的头像。</gray><newline><newline><dark_gray>权限:</dark_gray> <gray>npcavatar.apply</gray>'><#ad60e0>  /npcavatar clear</#ad60e0> <gray>-</gray> <white>从实体中清除头像。</white></hover></click>
    <click:run_command:'/npcavatar reload'><hover:show_text:'<white>/npcavatar reload</white><newline><newline><gray>重新加载配置和语言文件。</gray><newline><newline><dark_gray>权限:</dark_gray> <gray>npcavatar.reload</gray>'><#ad60e0>  /npcavatar reload</#ad60e0> <gray>-</gray> <white>重新加载插件。</white></hover></click>

  common:
    no_entity_in_sight: "<prefixes.error>视线范围内没有任何实体。"
    no_targets_matched: "<prefixes.error>没有匹配到任何目标。"
    console_requires_target: "<prefixes.error>控制台必须指定目标：<dark_gray>/serveravatar apply <id> <target></dark_gray>"

  upload:
    invalid_id: "<prefixes.error>无效的头像 ID：<yellow><id></yellow>"
    requested: "<prefixes.success>已请求客户端上传头像 <aqua><id></aqua>，路径：<dark_gray>'<path>'</dark_gray>。"

  apply:
    not_uploaded: "<prefixes.error>头像 <yellow>'<id>'</yellow> 尚未上传到服务器。"
    applied_to_one: "<prefixes.success>已将头像 <aqua>'<id>'</aqua> 应用到 <yellow><target></yellow>。"
    applied_to_many: "<prefixes.success>已将头像 <aqua>'<id>'</aqua> 应用到 <yellow><count></yellow> 个实体。"

  copy:
    copied_to_one: "<prefixes.success>已将 <yellow><source></yellow> 的头像复制到 <yellow>1</yellow> 个实体。"
    copied_to_many: "<prefixes.success>已将 <yellow><source></yellow> 的头像复制到 <yellow><count></yellow> 个目标实体。"
    console_requires_targets: "<prefixes.error>控制台必须指定目标：<dark_gray>/serveravatar copy <source> <targets></dark_gray>"

  copyfromplayer:
    requested_to_one: "<prefixes.success>已请求玩家 <yellow><player></yellow> 的头像，将应用到 <yellow>1</yellow> 个实体。"
    requested_to_many: "<prefixes.success>已请求玩家 <yellow><player></yellow> 的头像，将应用到 <yellow><count></yellow> 个实体。"
    console_requires_targets: "<prefixes.error>控制台必须指定目标：<dark_gray>/serveravatar copyfromplayer <player> <targets></dark_gray>"

  clear:
    cleared_one: "<prefixes.success>已清除 <yellow><target></yellow> 的头像。"
    cleared_many: "<prefixes.success>已清除 <yellow><count></yellow> 个实体的头像。"
    console_requires_target: "<prefixes.error>控制台必须指定一个目标。"

  reload:
    completed: "<prefixes.success>重载完成。"

global_placeholders:
  # 品牌前缀（可选，不会自动附加到状态前缀中）
  prefix: "<gray>[<gradient:#9339bd:#4e46c2>NPC Avatar</gradient>]</gray> "

  prefixes:
    info: "<dark_gray><bold>[</bold><blue><bold>i</bold></blue><dark_gray><bold>]</bold></dark_gray> <gray>"
    success: "<dark_gray><bold>[</bold><dark_green><bold>✔</bold></dark_green><dark_gray><bold>]</bold></dark_gray> <gray>"
    warn: "<dark_gray><bold>[</bold><gold><bold>!</bold></gold><dark_gray><bold>]</bold></dark_gray> <gold>"
    error: "<dark_gray><bold>[</bold><dark_red><bold>X</bold></dark_red><dark_gray><bold>]</bold></dark_gray> <red>"
    question: "<dark_gray><bold>[</bold><green><bold>?</bold></green><dark_gray><bold>]</bold></dark_gray> <gray>"
    announce: "<dark_gray><bold>[</bold><dark_purple><bold>!</bold></dark_purple><dark_gray><bold>]</bold></dark_gray> <light_purple>"

  symbols:
    right_arrow: "→"
    bullet: "•"
