commands:
  help: |-
    <#4e46c2><strikethrough>                          </strikethrough></#4e46c2> <#ad60e0>Commands</#ad60e0> <#4e46c2><strikethrough>                          </strikethrough></#4e46c2>
    <gray><italic>    Hover a command for extra info, click to run.</italic></gray>

    <click:suggest_command:'/npcavatar upload '><hover:show_text:'<white>/npcavatar upload <gold><id></gold> <#ad60e0>[path]</#ad60e0></white><newline><newline><gray>Upload an avatar from your currently equipped avatar or Figura avatars folder to the server.</gray><newline><newline><gray>Prefer applying uploaded avatars for those that you apply to multiple entities.</gray><newline><newline><gray><gold>id</gold>:</gray> <gray>Avatar identifier (namespace optional).</gray><newline><gray><#ad60e0>[path]</#ad60e0>:</gray> <gray>Optional Figura-relative path; uses your current avatar if unspecified.</gray><newline><newline><dark_gray>Permission:</dark_gray> <gray>npcavatar.upload</gray>'><#ad60e0>  /npcavatar upload</#ad60e0> <gray>-</gray> <white>Upload an avatar to the server.</white></hover></click>
    <click:suggest_command:'/npcavatar apply '><hover:show_text:'<white>/npcavatar apply <gold><avatarId></gold> <#ad60e0>[target]</#ad60e0></white><newline><newline><gray>Apply an uploaded avatar to the entity you\'re looking at (up to 10 blocks) or the specified entities.</gray><newline><newline><dark_gray>Permission:</dark_gray> <gray>npcavatar.apply</gray>'><#ad60e0>  /npcavatar apply</#ad60e0> <gray>-</gray> <white>Apply an avatar to entities.</white></hover></click>
    <click:suggest_command:'/npcavatar copy '><hover:show_text:'<white>/npcavatar copy <gold><source></gold> <#ad60e0>[targets]</#ad60e0></white><newline><newline><gray>Copy an entity\'s current avatar to the entity you\'re looking at (up to 10 blocks) or the specified entities.</gray><newline><newline><dark_gray>Permission:</dark_gray> <gray>npcavatar.apply</gray>'><#ad60e0>  /npcavatar copy</#ad60e0> <gray>-</gray> <white>An avatar from one entity to another.</white></hover></click>
    <click:suggest_command:'/npcavatar copyfromplayer '><hover:show_text:'<white>/npcavatar copyfromplayer <gold><player></gold> <#ad60e0>[targets]</#ad60e0></white><newline><newline><gray>Copy a player\'s current avatar to the entity you\'re looking at (up to 10 blocks) or the specified entities.</gray><newline><newline><dark_gray>Permission:</dark_gray> <gray>npcavatar.apply</gray>'><#ad60e0>  /npcavatar copyfromplayer</#ad60e0> <gray>-</gray> <white>Apply a player’s avatar.</white></hover></click>
    <click:suggest_command:'/npcavatar clear'><hover:show_text:'<white>/npcavatar clear <#ad60e0>[target]</#ad60e0></white><newline><newline><gray>Clear an applied avatar from the entity you\'re looking at (up to 10 blocks) or the specified entities.</gray><newline><newline><dark_gray>Permission:</dark_gray> <gray>npcavatar.apply</gray>'><#ad60e0>  /npcavatar clear</#ad60e0> <gray>-</gray> <white>Clear an avatar from an entity</white></hover></click>
    <click:run_command:'/npcavatar reload'><hover:show_text:'<white>/npcavatar reload</white><newline><newline><gray>Reload configuration and language files.</gray><newline><newline><dark_gray>Permission:</dark_gray> <gray>npcavatar.reload</gray>'><#ad60e0>  /npcavatar reload</#ad60e0> <gray>-</gray> <white>Reload the plugin.</white></hover></click>

  common:
    no_entity_in_sight: "<prefixes.error>No entity in sight."
    no_targets_matched: "<prefixes.error>No targets matched."
    console_requires_target: "<prefixes.error>Console must specify a target: <dark_gray>/serveravatar apply <id> <target></dark_gray>"

  upload:
    invalid_id: "<prefixes.error>Invalid avatar id: <yellow><id></yellow>"
    requested: "<prefixes.success>Uploading avatar <aqua><id></aqua> from <path>."

  apply:
    not_uploaded: "<prefixes.error>Avatar <yellow>'<id>'</yellow> is not uploaded on this server."
    applied_to_one: "<prefixes.success>Applied <aqua>'<id>'</aqua> to <yellow><target></yellow>."
    applied_to_many: "<prefixes.success>Applied <aqua>'<id>'</aqua> to <yellow><count></yellow> entity(ies)."

  copy:
    copied_to_one: "<prefixes.success>Copied avatar from <yellow><source></yellow> to <yellow>1</yellow> entity."
    copied_to_many: "<prefixes.success>Copied avatar from <yellow><source></yellow> to <yellow><count></yellow> target entity(ies)."
    console_requires_targets: "<prefixes.error>Console must specify targets: <dark_gray>/serveravatar copy <source> <targets></dark_gray>"

  copyfromplayer:
    requested_to_one: "<prefixes.success>Requested avatar from <yellow><player></yellow> will apply to <yellow>1</yellow> entity."
    requested_to_many: "<prefixes.success>Requested avatar from <yellow><player></yellow> will apply to <yellow><count></yellow> entity(ies)."
    console_requires_targets: "<prefixes.error>Console must specify targets: <dark_gray>/serveravatar copyfromplayer <player> <targets></dark_gray>"

  clear:
    cleared_one: "<prefixes.success>Cleared avatar from <yellow><target></yellow>."
    cleared_many: "<prefixes.success>Cleared avatar from <yellow><count></yellow> entity(ies)."
    console_requires_target: "<prefixes.error>Console must specify a target."

  reload:
    completed: "<prefixes.success>Reload complete."

global_placeholders:
  # Brand prefix (optional; not automatically included in status prefixes unless you add it)
  prefix: "<gray>[<gradient:#9339bd:#4e46c2>NPC Avatar</gradient>]</gray> "

  prefixes:
    info: "<dark_gray><bold>[</bold><blue><bold>i</bold></blue><dark_gray><bold>]</bold></dark_gray> <gray>"
    success: "<dark_gray><bold>[</bold><dark_green><bold>✔</bold></dark_green><dark_gray><bold>]</bold></dark_gray> <gray>"
    warn: "<dark_gray><bold>[</bold><gold><bold>!</bold></gold><dark_gray><bold>]</bold></dark_gray> <gold>"
    error: "<dark_gray><bold>[</bold><dark_red><bold>X</bold></dark_red><dark_gray><bold>]</bold></dark_gray> <red>"
    question: "<dark_gray><bold>[</bold><green><bold>?</bold></green><dark_gray><bold>]</bold></dark_gray> <gray>"
    announce: "<dark_gray><bold>[</bold><dark_purple><bold>!</bold></dark_purple><dark_gray><bold>]</bold></dark_gray> <light_purple>"

  symbols:
    right_arrow: "→"
    bullet: "•"
